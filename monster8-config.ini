# Monster8 V2 custom Marlin configuration
# Marlin 2.1.2.8

[config:base]
ini_use_config = base

motherboard = BOARD_MKS_MONSTER8_V2
serial_port = -1
baudrate = 250000
custom_machine_name = "Monster8 MultiTool"

# Step / direction driver types
x_driver_type = TB6600
y_driver_type = TB6600
z_driver_type = TB6600
y2_driver_type = TB6600
e0_driver_type = A4988

# Dual Y is enabled automatically by Y2_DRIVER_TYPE in Marlin 2.1.2.8
invert_y2_vs_y_dir = true

# Initial motor directions - verify with 1mm jogs
invert_x_dir = false
invert_y_dir = false
invert_z_dir = false
invert_e0_dir = false

# Machine envelope: ~24 x 36 x 12 inches
x_bed_size = 610
y_bed_size = 914
x_min_pos = 0
y_min_pos = 0
z_min_pos = 0
x_max_pos = 610
y_max_pos = 914
z_max_pos = 305

# NO physical limit switches are installed yet.
# Marlin still requires homing input definitions at compile time, so the MIN
# inputs are defined but left physically unconnected. Do NOT issue G28 until
# real switches/probe homing are installed.
use_xmin_plug = on
use_xmax_plug = off
use_ymin_plug = on
use_ymax_plug = off
use_zmin_plug = on
use_zmax_plug = off
min_software_endstops = off
max_software_endstops = off
no_motion_before_homing = off
validate_homing_endstops = off

# Placeholder homing directions for later
x_home_dir = -1
y_home_dir = -1
z_home_dir = -1

# Motion defaults
# X/Y: GT2 2mm, 20T pulley, 3200 pulses/rev -> 80 steps/mm
# Z: 8mm travel/rev, 3200 pulses/rev -> 400 steps/mm
# Sprite Pro starting E steps: 424.9
default_axis_steps_per_unit = { 80.00, 80.00, 400.00, 424.90 }
default_max_feedrate = { 150, 120, 12, 50 }
default_max_acceleration = { 500, 400, 100, 2000 }
default_acceleration = 400
default_travel_acceleration = 500
default_retract_acceleration = 1000

# Sprite Pro hotend - initial thermistor table
# 285C limit leaves Marlin's required thermal overshoot safety margin.
autotemp = off
extruders = 1
default_nominal_filament_dia = 1.75
temp_sensor_0 = 13
heater_0_mintemp = 5
heater_0_maxtemp = 285
pidtemp = on
thermal_protection_hotends = on
prevent_cold_extrusion = on
extrude_mintemp = 170

# Heated bed not installed/configured yet
temp_sensor_bed = 0

# LCD / SD - MKS Mini 12864 V3
mks_mini_12864_v3 = on
sdsupport = on

# Mini 12864 V3 has three WS2811 RGB channels (screen + encoder LEDs).
# Explicit RGB ordering is required for this display. Make the backlight start
# bright white and expose Marlin's Lights menu so color / brightness can be
# adjusted from the LCD knob.
neopixel_led = on
neopixel_type = NEO_RGB
neopixel_pixels = 3
neopixel_brightness = 255
neopixel_startup_test = on
led_control_menu = on
led_color_presets = on
led_user_preset_red = 255
led_user_preset_green = 255
led_user_preset_blue = 255
led_user_preset_white = 0
led_user_preset_brightness = 255
led_user_preset_startup = on

# Runtime tuning from LCD / EEPROM
eeprom_settings = on
eeprom_auto_init = on
editable_steps_per_unit = on

# CNC Zero menu on the 12864 LCD
custom_menu_main = on
custom_menu_main_title = "CNC Zero"
custom_menu_main_script_done = "M117 Zero Set"
custom_menu_main_script_audible_feedback = on
custom_menu_main_script_return = on
custom_menu_main_only_idle = on
main_menu_item_1_desc = "Set XYZ Zero"
main_menu_item_1_gcode = "G92 X0 Y0 Z0"
main_menu_item_2_desc = "Set XY Zero"
main_menu_item_2_gcode = "G92 X0 Y0"
main_menu_item_3_desc = "Set X Zero"
main_menu_item_3_gcode = "G92 X0"
main_menu_item_4_desc = "Set Y Zero"
main_menu_item_4_gcode = "G92 Y0"
main_menu_item_5_desc = "Set Z Zero"
main_menu_item_5_gcode = "G92 Z0"

# Emergency stop / software reset support.
# M112 remains a true latched Marlin kill. EMERGENCY_PARSER keeps watching the
# USB serial stream while killed, and SOFT_RESET_VIA_SERIAL makes Ctrl-X (^X,
# ASCII 0x18) reboot the STM32 without cycling machine power. The Mini12864
# encoder button can also reset after a kill with SOFT_RESET_ON_KILL.
emergency_parser = on
soft_reset_via_serial = on
soft_reset_on_kill = on

# General safety / communications
use_watchdog = on
host_keepalive_feature = on
busy_while_heating = on

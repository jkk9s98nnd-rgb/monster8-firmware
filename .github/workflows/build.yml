name: Build Monster8 Marlin Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout Marlin 2.1.2.8
        uses: actions/checkout@v4
        with:
          repository: MarlinFirmware/Marlin
          ref: 2.1.2.8
          path: MarlinSource

      - name: Add native BIQU MicroProbe V2 support
        run: python patches/patch_microprobe.py

      - name: Add selectable Bilinear mesh support
        run: python patches/patch_variable_bilinear.py

      - name: Add adjustable temporary mesh area
        run: python patches/patch_mesh_area.py

      - name: Add stand-alone LCD setup cube
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("MarlinSource/Marlin/src/MarlinCore.cpp")
          s = p.read_text()
          marker = "void loop() {"
          start = s.find(marker)
          if start < 0:
              raise SystemExit("Marlin loop() not found")
          pos = s.find("    idle();", start)
          if pos < 0:
              raise SystemExit("Marlin 2.1.2.8 loop idle() not found")
          s = s[:pos] + "    marlin.idle();" + s[pos + len("    idle();"):]
          p.write_text(s)
          PY
          python patches/patch_test_cube.py
          python - <<'PY'
          from pathlib import Path
          p = Path("MarlinSource/Marlin/src/MarlinCore.cpp")
          s = p.read_text()
          marker = "void loop() {"
          start = s.find(marker)
          pos = s.find("    marlin.idle();", start)
          if pos < 0:
              raise SystemExit("Temporary marlin.idle() not found after cube patch")
          s = s[:pos] + "    idle();" + s[pos + len("    marlin.idle();"):]
          p.write_text(s)
          PY

      - name: Add combined LCD polish and safety fixes
        run: python patches/patch_polish.py

      - name: Add probe and mesh reliability fixes
        run: python patches/patch_probe_mesh_reliability.py

      - name: Add LCD mesh safe height and diagnostics
        run: python patches/patch_lcd_mesh_debug_v2.py

      - name: Make mesh bounds follow the single XY zero
        run: python patches/patch_mesh_work_zero.py

      - name: Add adjustable probe search depth
        run: python patches/patch_probe_search_depth.py

      - name: Add mapped-area cube and stop improvements
        run: python patches/patch_cube_map_infill_stop.py

      - name: Restore bed-level state isolation
        run: python patches/patch_restore_bedlevel_isolation.py

      - name: Fix test stop temp and prime placement
        run: python patches/patch_test_stop_temp_prime.py

      - name: Start test with lift and XY zero move
        run: python patches/patch_test_start_lift_zero.py

      - name: Wait for physical lift before XY motion
        run: python patches/patch_wait_for_physical_lift.py

      - name: Prevent STOP queue race and LCD deadlock
        run: python patches/patch_stop_deadlock_guard.py

      - name: Add selectable Orca XY homing guard
        run: python patches/patch_orca_home_guard.py

      - name: Add selectable external auto-prime lines
        run: python patches/patch_auto_prime_external.py

      - name: Apply custom config
        run: cp monster8-config.ini MarlinSource/Marlin/config.ini

      - name: Add SD pause stop and finish parking
        run: python patches/patch_sd_pause_park.py

      - name: Add wiper alignment wizard
        run: python patches/patch_wiper_alignment.py

      - name: Add wiper calibration and automatic wiping
        run: python patches/patch_wiper_runtime.py

      - name: Link wiper runtime into compiled source
        run: python patches/patch_wiper_linkfix.py

      - name: Fix virtual XY wiper controls and self-heating test
        run: python patches/patch_wiper_v2.py

      - name: Keep wiper menu open and use direct Z nudges
        run: python patches/patch_wiper_v3.py

      - name: Use direct blocking motion for calibrated wiper
        run: python patches/patch_wiper_v4.py

      - name: Set wiper default contact to Z3.50
        run: python patches/patch_wiper_v5_default.py

      - name: Allow Z-only probe homing for CNC
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("MarlinSource/Marlin/src/inc/Warnings.cpp")
          s = p.read_text()
          old = '#error "Z_SAFE_HOMING is recommended when homing with a probe. Enable Z_SAFE_HOMING or comment out this line to continue."'
          new = '#warning "CNC mode: Z probe homing allowed at current X/Y without Z_SAFE_HOMING."'
          if old not in s:
              raise SystemExit("Expected Z_SAFE_HOMING check not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply Mini12864 individual LED feature
        run: |
          cp patches/mini12864_individual_leds.h MarlinSource/Marlin/src/feature/leds/mini12864_individual_leds.h
          cp patches/mini12864_individual_leds.cpp MarlinSource/Marlin/src/feature/leds/mini12864_individual_leds.cpp
          cp patches/menu_led.cpp MarlinSource/Marlin/src/lcd/menu/menu_led.cpp
          python patches/patch_leds.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile Monster8 firmware
        working-directory: MarlinSource
        run: platformio run -e mks_monster8

      - name: Collect firmware
        run: |
          mkdir -p output
          cp MarlinSource/.pio/build/mks_monster8/mks_monster8.bin output/mks_monster8.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monster8-Wiper-V5-Firmware
          path: output/mks_monster8.bin
          if-no-files-found: error

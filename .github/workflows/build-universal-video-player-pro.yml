name: Build Universal Video Player Pro

on:
  push:
    branches:
      - universal-video-player-pro-build
    paths:
      - 'UniversalVideoPlayerPro/src/**'
      - '.github/workflows/build-universal-video-player-pro.yml'
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore 'UniversalVideoPlayerPro/src/UniversalVideoPlayerPro.csproj' -r win-x64

      - name: Publish self-contained Windows build
        shell: pwsh
        run: dotnet publish 'UniversalVideoPlayerPro/src/UniversalVideoPlayerPro.csproj' -c Release -r win-x64 -p:Platform=x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false --no-restore -o 'publish'

      - name: Package ready-to-run ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'publish/*' -DestinationPath 'UniversalVideoPlayerPro_v0.1_Windows_x64.zip' -Force

      - name: Upload ready-to-run build
        uses: actions/upload-artifact@v4
        with:
          name: UniversalVideoPlayerPro-v0.1-Windows-x64
          path: UniversalVideoPlayerPro_v0.1_Windows_x64.zip
          if-no-files-found: error
          retention-days: 14

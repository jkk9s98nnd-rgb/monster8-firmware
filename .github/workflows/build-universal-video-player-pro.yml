name: Build Universal Video Player Pro

on:
  push:
    branches:
      - universal-video-player-pro-build
    paths:
      - 'UniversalVideoPlayerPro/src/**'
      - '.github/workflows/build-universal-video-player-pro.yml'
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore 'UniversalVideoPlayerPro/src/UniversalVideoPlayerPro.csproj' -r win-x64

      - name: Build self-contained Windows Release
        shell: pwsh
        run: dotnet build 'UniversalVideoPlayerPro/src/UniversalVideoPlayerPro.csproj' -c Release -r win-x64 -p:Platform=x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true --no-restore -o 'releasebuild'

      - name: Verify executable and smoke-test launch
        shell: pwsh
        run: |
          $exe = Resolve-Path 'releasebuild/UniversalVideoPlayerPro.exe'
          Write-Host "Testing $exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) {
            Write-Error "UniversalVideoPlayerPro exited during startup. Exit code: $($p.ExitCode)"
            exit 1
          }
          Write-Host "Process is still running after startup test. MainWindowHandle=$($p.MainWindowHandle)"
          Stop-Process -Id $p.Id -Force

      - name: Package tested ready-to-run ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'releasebuild/*' -DestinationPath 'UniversalVideoPlayerPro_v0.1b_Windows_x64.zip' -Force

      - name: Upload tested ready-to-run build
        uses: actions/upload-artifact@v4
        with:
          name: UniversalVideoPlayerPro-v0.1b-Windows-x64-tested
          path: UniversalVideoPlayerPro_v0.1b_Windows_x64.zip
          if-no-files-found: error
          retention-days: 14

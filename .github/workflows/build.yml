name: Build Monster8 Marlin Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout Marlin 2.1.2.8
        uses: actions/checkout@v4
        with:
          repository: MarlinFirmware/Marlin
          ref: 2.1.2.8
          path: MarlinSource

      - name: Add native BIQU MicroProbe V2 support
        run: python patches/patch_microprobe.py

      - name: Add selectable Bilinear mesh support
        run: python patches/patch_variable_bilinear.py

      - name: Apply custom config
        run: |
          cp monster8-config.ini MarlinSource/Marlin/config.ini
          # The extruder is now using an external pulse/dir driver.
          sed -i 's/e0_driver_type = A4988/e0_driver_type = TB6600/' MarlinSource/Marlin/config.ini
          cat >> MarlinSource/Marlin/config.ini <<'EOF'
          
          # Selectable 3x3 / 5x5 / 7x7 Bilinear leveling.
          # A 13x13 internal mesh exactly represents all three selectable grids.
          auto_bed_leveling_bilinear = on
          grid_max_points_x = 13
          grid_max_points_y = 13
          lcd_bed_leveling = on
          babystepping = on
          babystep_without_homing = on
          babystep_always_available = on
          babystep_zprobe_offset = on
          babystep_display_total = on
          EOF

      - name: Allow Z-only probe homing for CNC
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("MarlinSource/Marlin/src/inc/Warnings.cpp")
          s = p.read_text()
          old = '#error "Z_SAFE_HOMING is recommended when homing with a probe. Enable Z_SAFE_HOMING or comment out this line to continue."'
          new = '#warning "CNC mode: Z probe homing allowed at current X/Y without Z_SAFE_HOMING."'
          if old not in s:
              raise SystemExit("Expected Z_SAFE_HOMING check not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply Mini12864 individual LED feature
        run: |
          cp patches/mini12864_individual_leds.h MarlinSource/Marlin/src/feature/leds/mini12864_individual_leds.h
          cp patches/mini12864_individual_leds.cpp MarlinSource/Marlin/src/feature/leds/mini12864_individual_leds.cpp
          cp patches/menu_led.cpp MarlinSource/Marlin/src/lcd/menu/menu_led.cpp
          python patches/patch_leds.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile Monster8 firmware
        working-directory: MarlinSource
        run: platformio run -e mks_monster8

      - name: Collect firmware
        run: |
          mkdir -p output
          cp MarlinSource/.pio/build/mks_monster8/mks_monster8.bin output/mks_monster8.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monster8-MicroProbe-V2-Firmware
          path: output/mks_monster8.bin
          if-no-files-found: error
